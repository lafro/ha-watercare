version: 2
# Labels are explicit: github-actions in kebab case instead of Dependabot's
# default github_actions. Dependabot ignores a listed label that does not
# exist in the repository (it only creates its default labels), so create a
# label before listing it here.
updates:
  # uv updates pyproject.toml and uv.lock together, so CI (uv sync --locked)
  # tests exactly what a pull request proposes.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, python]
    groups:
      python:
        patterns: ["*"]
    ignore:
      # The test harness pins homeassistant exactly, so a homeassistant bump
      # on its own cannot resolve. Bump pytest-homeassistant-custom-component
      # instead; test_home_assistant_under_test_matches_the_harness fails if
      # what is tested drifts from the harness's own release.
      - dependency-name: homeassistant
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ["*"]
